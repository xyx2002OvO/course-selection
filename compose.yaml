name: selection-demo

# Experiment budget. If you change cpus, also change -XX:ActiveProcessorCount to the same integer.
# Heap is 512m inside a 1g cgroup so metaspace, threads, direct buffers and AlwaysPreTouch still fit.
x-java-cpus: &java-cpus 2.0
x-java-mem: &java-mem 1g
x-java-opts: &java-opts >-
  -XX:ActiveProcessorCount=2
  -Xms512m
  -Xmx512m
  -XX:+UseContainerSupport
  -XX:+AlwaysPreTouch
  -XX:MaxMetaspaceSize=128m
  -XX:ReservedCodeCacheSize=64m
  -Djava.security.egd=file:/dev/urandom

x-app: &app
  image: selection-demo:local
  build: .
  cpus: *java-cpus
  mem_limit: *java-mem
  mem_reservation: *java-mem
  environment: &environment
    JAVA_TOOL_OPTIONS: *java-opts
    DB_URL: jdbc:mysql://mysql:3306/selection?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    DB_USER: selection
    DB_PASSWORD: selection-dev
    REDIS_HOST: redis
    REDIS_PORT: 6379
    KAFKA_BOOTSTRAP: kafka:9092
    DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-pass}
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.4
    cpus: 2.0
    mem_limit: 1g
    mem_reservation: 1g
    command: ["--innodb-buffer-pool-size=256M", "--max-connections=80", "--innodb-flush-log-at-trx-commit=1"]
    environment:
      MYSQL_DATABASE: selection
      MYSQL_USER: selection
      MYSQL_PASSWORD: selection-dev
      MYSQL_ROOT_PASSWORD: root-dev
    ports: ["127.0.0.1:13306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uselection -p$$MYSQL_PASSWORD selection -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    cpus: 1.0
    mem_limit: 256m
    mem_reservation: 256m
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:4.0.2
    cpus: 1.0
    mem_limit: 768m
    mem_reservation: 768m
    ports: ["127.0.0.1:19092:19092"]
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 30
  init:
    <<: *app
    restart: "no"
    environment:
      <<: *environment
      BOOTSTRAP: "true"
      API_ENABLED: "false"
      WORKER_ENABLED: "false"
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
  api:
    <<: *app
    environment:
      <<: *environment
      API_ENABLED: "true"
      WORKER_ENABLED: "false"
      PORT: 18080
    ports: ["127.0.0.1:18080:18080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/18080'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 40s
    depends_on:
      init: {condition: service_completed_successfully}
  worker:
    <<: *app
    environment:
      <<: *environment
      API_ENABLED: "false"
      WORKER_ENABLED: "true"
      PORT: 18081
    ports: ["127.0.0.1:18081:18081"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/18081'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 40s
    depends_on:
      init: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}

volumes:
  mysql-data:
  redis-data:
