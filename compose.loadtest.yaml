services:
  api:
    environment:
      SPRING_PROFILES_ACTIVE: loadtest
      MANAGEMENT_PORT: "18090"
    ports: !override
      - "127.0.0.1:18088:18080"
      - "127.0.0.1:18090:18090"
  web:
    environment:
      SPRING_PROFILES_ACTIVE: loadtest
      SUBMIT_GLOBAL: ${SUBMIT_GLOBAL:-150}
      QUERY_GLOBAL: "100000"
      STUDENT_FROM: "20001"
      STUDENT_TO: "80000"
      MANAGEMENT_PORT: "18092"
  admission:
    environment:
      SPRING_PROFILES_ACTIVE: loadtest
      SUBMIT_GLOBAL: ${SUBMIT_GLOBAL:-150}
      QUERY_GLOBAL: "100000"
      STUDENT_FROM: "20001"
      STUDENT_TO: "80000"
      MANAGEMENT_PORT: "18093"
      SYNC_BASELINE: ${SYNC_BASELINE:-false}
    ports: ["127.0.0.1:18093:18093"]
  worker:
    environment:
      SPRING_PROFILES_ACTIVE: loadtest
      MANAGEMENT_PORT: "18091"
      CONFIRM_CONCURRENCY: ${CONFIRM_CONCURRENCY:-6}
      PROJECT_CONCURRENCY: ${PROJECT_CONCURRENCY:-6}
    ports: ["127.0.0.1:18091:18091"]
  init:
    environment:
      SPRING_PROFILES_ACTIVE: loadtest
  mysql:
    cpus: 4.0
    mem_limit: 2g
    mem_reservation: 2g
    command:
      [
        "--innodb-buffer-pool-size=512M",
        "--max-connections=80",
        "--innodb-flush-log-at-trx-commit=2",
        "--server-id=1",
        "--log-bin=mysql-bin",
        "--binlog-format=ROW",
        "--binlog-row-image=FULL",
      ]
  loadgen:
    image: grafana/k6:0.57.0
    cpus: 4.0
    mem_limit: 2g
    mem_reservation: 2g
    working_dir: /scripts
    volumes:
      - ./loadtest/k6:/scripts:ro
      - ${LOADTEST_OUT:-./loadtest/out}:/out
    environment:
      BASE_URL: http://api:18080
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-pass}
      STUDENT_FROM: "20001"
      STUDENT_TO: "80000"
      COURSE_OPEN: "201"
      COURSE_SCARCE: "202"
      COURSE_FROM: "211"
      COURSE_TO: "230"
      SYNC_BASELINE: ${SYNC_BASELINE:-false}
    profiles: ["loadgen"]
    depends_on:
      api: {condition: service_healthy}
      admission: {condition: service_healthy}
      worker: {condition: service_healthy}
