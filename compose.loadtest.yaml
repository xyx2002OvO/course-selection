services:
  api:
    environment:
      SPRING_PROFILES_ACTIVE: loadtest
      SUBMIT_GLOBAL: "100000"
      QUERY_GLOBAL: "100000"
      MANAGEMENT_PORT: "18090"
    ports: ["127.0.0.1:18090:18090"]
  worker:
    environment:
      SPRING_PROFILES_ACTIVE: loadtest
      SUBMIT_GLOBAL: "100000"
      QUERY_GLOBAL: "100000"
      MANAGEMENT_PORT: "18091"
      CONFIRM_CONCURRENCY: ${CONFIRM_CONCURRENCY:-6}
      PROJECT_CONCURRENCY: ${PROJECT_CONCURRENCY:-6}
    ports: ["127.0.0.1:18091:18091"]
  init:
    environment:
      SPRING_PROFILES_ACTIVE: loadtest
  loadgen:
    image: grafana/k6:0.57.0
    cpus: 4.0
    mem_limit: 2g
    mem_reservation: 2g
    working_dir: /scripts
    volumes:
      - ./loadtest/k6:/scripts:ro
      - ${LOADTEST_OUT:-./loadtest/out}:/out
    environment:
      BASE_URL: http://api:18080
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-pass}
      STUDENT_FROM: "20001"
      STUDENT_TO: "80000"
      COURSE_OPEN: "201"
      COURSE_SCARCE: "202"
      COURSE_FROM: "211"
      COURSE_TO: "222"
    profiles: ["loadgen"]
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_healthy}
